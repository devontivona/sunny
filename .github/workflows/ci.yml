name: CI

# The merge gate (design D9/D11): typecheck + unit + integration, durable-workflow
# tests, and the production build (+ dashboard typecheck) on every change.
# No service container and no Docker — integration uses in-process PGlite (D4).
# Mostly mock-model and free, with ONE deliberate exception: the real-model
# recovery regression test (tests/recovery.realmodel.integration.test.ts) calls
# Haiku, so the integration step needs ANTHROPIC_API_KEY (a few cents/run). Fork
# PRs without the secret will fail that one test. Evals (paid Opus, N-run,
# non-deterministic) remain out of this gate — see evals.yml.
on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; newer pushes cancel older ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck + unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `coverage` runs the unit + integration projects with coverage in one pass,
      # so a failure in either lane fails the gate. Coverage itself is informational
      # (surfaced below); it does NOT gate merge (D12 — judgment over a number).
      - name: Unit + integration (with coverage)
        run: npm run coverage
        env:
          # Used only by the real-model recovery regression test; the rest of the
          # lane is mock-only and ignores it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Coverage summary (informational)
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const p = "coverage/coverage-summary.json";
            if (!fs.existsSync(p)) { console.log("no coverage summary"); process.exit(0); }
            const t = JSON.parse(fs.readFileSync(p, "utf8")).total;
            const pct = (k) => t[k] ? `${t[k].pct}%` : "n/a";
            const md = [
              "## Coverage (informational — not a merge gate)",
              "",
              "| Lines | Statements | Functions | Branches |",
              "|---|---|---|---|",
              `| ${pct("lines")} | ${pct("statements")} | ${pct("functions")} | ${pct("branches")} |`,
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY || "/dev/stdout", md + "\n");
          '

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Durable-workflow tests (@workflow/vitest Local World + PGlite — no services, no
  # real model). A separate lane because they run the REAL runConversation/subagent
  # workflows (~3 min): previously local-only, which let a merged PR break them
  # undetected (the send_image `required` drift, Jul 2026).
  workflow-tests:
    name: durable workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Workflow tests (WDK Local World)
        run: npm run test:workflow

  # The production build + the dashboard SPA's typecheck — neither was previously in
  # CI (the unified vite build was "build locally before merging", which relies on
  # remembering to). The build exercises the WDK builders' whole-repo sweep, so a
  # file that would poison the workflow VM bundle fails HERE, not at deploy.
  build:
    name: production build + dashboard typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dashboard typecheck (app/ tsconfig)
        run: npm run dashboard:typecheck

      - name: Production build (unified vite + nitro + WDK)
        run: NITRO_VITE=1 node node_modules/vite/bin/vite.js build --config vite.config.unified.ts
