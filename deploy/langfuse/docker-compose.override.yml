# Sunny's deltas on top of the vendored upstream Langfuse compose.
# Docker Compose auto-merges this file with docker-compose.yml.
#
# Port bindings (no third-party egress; D-OB1/D-OB7). janeway is a headless home
# server, so the web UI is bound to ALL interfaces on the LAN port
# (LANGFUSE_WEB_PORT, default 3010) — reachable at http://<host>:3010 on the
# trusted LAN, gated by Langfuse's own login. The backing stores
# (Postgres/Clickhouse/Redis) and minio stay on 127.0.0.1 — nothing but the UI
# is network-reachable. This is LAN exposure, NOT public egress: no Langfuse
# Cloud, no tunnel. For a stricter posture, change the web binding back to
# `127.0.0.1:...` and reach it via `ssh -L 3010:localhost:3010 <host>`.
# `NEXTAUTH_URL` (in .env) must match the host you browse to, or auth breaks.
# The `!override` tag REPLACES upstream's port list (Compose otherwise
# concatenates list values, which would leave upstream's binding in place).
#
# Image versions are inherited from the vendored docker-compose.yml snapshot
# (upstream pins langfuse:3 / redis:7 / postgres:17; clickhouse and chainguard
# minio float to latest). "Pinned" here means controlled-refresh: bump versions
# by re-vendoring the upstream file, not by silent `docker compose pull` drift.
# To harden further, add `image: <repo>@sha256:...` pins for the two floating
# images below. Everything else — Clickhouse single-node, the minio bucket, the
# env contract — comes straight from upstream.
services:
  langfuse-web:
    ports: !override
      - '${LANGFUSE_WEB_PORT:-3010}:3000'

  minio:
    ports: !override
      - '127.0.0.1:9090:9000'
      - '127.0.0.1:9091:9001'
